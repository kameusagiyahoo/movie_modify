name: Browser UI smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media backend and generate test video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt httpx
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=24:duration=3 \
            -c:v libvpx -deadline realtime -cpu-used 8 -b:v 350k \
            -pix_fmt yuv420p tests/browser/fixture.webm
      - name: Install headless Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise desktop, iPhone-width and local editor
        run: npx playwright test --config=playwright.config.cjs
      - name: Archive failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
