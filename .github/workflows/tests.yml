name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/movie_modify_ui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/movie_modify_ui.js
          node --check web/live_preview.js
          node --check web/responsive_ui.js
          node --check docs/pages.js
          node --check docs/edit_history.js
          node --check docs/bridge_client.js
          node --check docs/live_preview.js

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Python requirements and integration tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q
      - name: Windows JavaScript syntax
        shell: pwsh
        run: |
          node --check web/live_preview.js
          node --check web/responsive_ui.js
          node --check docs/pages.js
          node --check docs/edit_history.js
          node --check docs/bridge_client.js
